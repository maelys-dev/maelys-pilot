# maelys-pilot declares the least a released product can: the socle's
# three default targets, a reviewer at the gate, and nothing else. What a
# trial needs beyond this is added by the trial, on a branch.
[gate]
reviewer

# Two pins the pilot's own build does not read: they exist so that the
# socle's clones run here. One says on-request, and one job below asks
# for it by name.
[dependencies]
apart
